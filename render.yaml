services:
  - type: web
    name: controle-frota
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
